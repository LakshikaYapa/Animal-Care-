name: pawcare

services:
  backend:
    image: pawcare-backend:latest
    build:
      context: ./Backend
      dockerfile: Dockerfile
    env_file:
      - ./Backend/.env
    environment:
      NODE_ENV: production
      PORT: "5000"
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped
    networks:
      - pawcare-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/health').then(async response => { const body = await response.json(); process.exit(response.ok && body.database === 'connected' ? 0 : 1); }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  frontend:
    image: pawcare-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    restart: unless-stopped
    networks:
      - pawcare-network
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/ || exit 1
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  pawcare-network:
    driver: bridge
